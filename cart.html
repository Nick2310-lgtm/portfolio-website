<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nick Portfolio | Cart</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background: #f0f2f5;
            color: #333;
        }

        header {
            background: #34495e;
            color: white;
            text-align: center;
            padding: 20px 0;
            position: sticky;
            top: 0;
        }

        nav a {
            margin: 0 20px;
            text-decoration: none;
            color: white;
            font-weight: bold;
        }

        main {
            max-width: 1000px;
            margin: auto;
            padding: 50px 20px;
        }

        .item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            margin-top: 20px;
            border-radius: 10px;
            overflow: hidden;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th {
            background: #34495e;
            color: white;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 15px;
            background: #2ecc71;
            color: white;
            border: none;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #27ae60;
        }

        footer {
            background: #34495e;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
        }
    </style>
</head>

<body>

<header>
    <h1>Interactive Cart</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="projects.html">Projects</a>
        <a href="skills.html">Skills</a>
        <a href="cart.html">Cart</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>

    <div class="item" onclick="addToCart('AI Course',999)">AI Course – ₹999</div>
    <div class="item" onclick="addToCart('ML Notes',499)">ML Notes – ₹499</div>
    <div class="item" onclick="addToCart('NLP Tutorial',799)">NLP Tutorial – ₹799</div>

    <table>
        <thead>
            <tr>
                <th>Item</th>
                <th>Price</th>
            </tr>
        </thead>
        <tbody id="cart"></tbody>
        <tfoot>
            <tr>
                <th>Total</th>
                <th id="total">0</th>
            </tr>
        </tfoot>
    </table>

    <button onclick="pay()">Pay Now</button>

</main>

<script>
let total = 0;

function addToCart(item, price) {
    document.getElementById("cart").innerHTML += `<tr><td>${item}</td><td>${price}</td></tr>`;
    total += price;
    document.getElementById("total").innerText = total;
}

function pay() {
    if (total === 0) {
        alert("Cart is empty!");
    } else {
        alert("Payment successful ₹" + total);
        location.reload();
    }
}
</script>

<footer>
    &copy; 2026 Nick Portfolio
</footer>

</body>
</html>
